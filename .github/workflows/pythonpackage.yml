name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Untrusted pull-request code is never scheduled on the local runner. Public PRs
# receive hosted lint and lab gates; functional core validation is triggered by
# trusted pushes to repository-owned codex/** branches (and main).
jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade -c requirements/core.txt -r requirements/public-types.txt pip setuptools wheel ruff
      - name: Python errors
        run: python -m ruff check --select E9,F63,F7,F82 botbowl tests examples tools setup.py
      - name: Bounded public API types and negative calls
        run: python tools/ci/check_public_types.py
      - name: Bounded lab protocol types and negative signatures
        run: python tools/ci/check_lab_types.py
      - name: Core selection negative controls
        run: python tools/ci/check_core_selection.py
      - name: Parallel shard process controls
        run: python tests/ci/check_parallel_shards.py
      - name: Mandatory lab receipt and private failure-output controls
        run: python tests/ci/check_lab_profile.py
      - name: Validate Actions YAML and expressions
        run: |
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck='' -pyflakes=''

  core:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/codex/'))
    name: core / ${{ matrix.python }} / ${{ matrix.backend }}
    runs-on: [self-hosted, codex]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11']
        backend: [python, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade -c requirements/core.txt pip setuptools wheel build
      - name: Installed unit and integration tests
        run: python tools/ci/run_profile.py suite --backend '${{ matrix.backend }}' --output '${{ runner.temp }}/evidence'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: core-${{ matrix.python }}-${{ matrix.backend }}
          # Counts/reasons and package versions are JSON; raw tracebacks can
          # contain privileged lab snapshots or RNG state even in core tests.
          path: ${{ runner.temp }}/evidence/*.json
          retention-days: 14

  lab:
    name: lab / ${{ matrix.profile }} / ${{ matrix.backend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: lab-fast, backend: python}
          - {profile: lab-fast, backend: native}
          - {profile: lab-extended, backend: python}
          - {profile: lab-extended, backend: native}
          - {profile: lab-adapters, backend: python}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade -c requirements/core.txt pip setuptools wheel build
      - name: Installed laboratory contracts (6 GiB per process)
        shell: bash
        run: |
          ulimit -v 6291456
          python tools/ci/run_profile.py '${{ matrix.profile }}' --backend '${{ matrix.backend }}' --output '${{ runner.temp }}/lab-evidence'
      # Do not upload pytest tracebacks, datasets, snapshots or raw RNG state.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lab-${{ matrix.profile }}-${{ matrix.backend }}
          path: |
            ${{ runner.temp }}/lab-evidence/result.json
            ${{ runner.temp }}/lab-evidence/lab-*.json
          retention-days: 14
      - name: Remove installed environments and generated fixtures after cancellation
        if: always()
        run: rm -rf -- '${{ runner.temp }}/lab-evidence'
