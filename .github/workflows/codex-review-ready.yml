name: Audit review-ready PR with local Codex

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Controlling review-ready issue number to audit
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: codex-review-${{ github.repository }}-issue-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'review-ready'
    runs-on: [self-hosted, codex]

    steps:
      - name: Resolve review-ready issue and pull request
        id: target
        shell: bash
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          test -n "$ISSUE_NUMBER"

          export ISSUE_NUMBER
          pr_number="$(python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          token = os.environ["GITHUB_TOKEN"]
          owner = repo.split("/", 1)[0]

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "botbowl-review-ready-workflow",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          issue = get_json(f"https://api.github.com/repos/{repo}/issues/{issue_number}")
          labels = {entry["name"] for entry in issue.get("labels", [])}
          if issue.get("state") != "open" or "review-ready" not in labels:
              raise SystemExit(
                  f"Issue #{issue_number} is not an open review-ready issue; labels={sorted(labels)!r}"
              )

          head = f"{owner}:codex/issue-{issue_number}"
          query = urllib.parse.urlencode({"state": "open", "head": head, "per_page": 100})
          pulls = get_json(f"https://api.github.com/repos/{repo}/pulls?{query}")
          if len(pulls) != 1:
              numbers = [pull.get("number") for pull in pulls]
              raise SystemExit(
                  f"Expected exactly one open PR for {head}, found {len(pulls)}: {numbers}"
              )

          print(pulls[0]["number"])
          PY
          )"

          echo "issue_number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "Resolved issue #${ISSUE_NUMBER} to PR #${pr_number}."

      - name: Resolve persistent issue worktree
        id: worktree
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
        run: |
          set -euo pipefail
          : "${SKILLFORGE_REPO_ROOT:?SKILLFORGE_REPO_ROOT must point to the persistent local checkout for this repository}"

          repo_root="$(cd "$SKILLFORGE_REPO_ROOT" && pwd -P)"
          git -C "$repo_root" rev-parse --is-inside-work-tree >/dev/null

          origin="$(git -C "$repo_root" remote get-url origin)"
          case "$origin" in
            "https://github.com/${GITHUB_REPOSITORY}"|"https://github.com/${GITHUB_REPOSITORY}.git"|"git@github.com:${GITHUB_REPOSITORY}"|"git@github.com:${GITHUB_REPOSITORY}.git"|"ssh://git@github.com/${GITHUB_REPOSITORY}"|"ssh://git@github.com/${GITHUB_REPOSITORY}.git") ;;
            *) echo "SKILLFORGE_REPO_ROOT points to unexpected origin: $origin" >&2; exit 1 ;;
          esac

          git -C "$repo_root" fetch --prune origin
          git -C "$repo_root" worktree prune

          branch="codex/issue-${ISSUE_NUMBER}"
          branch_ref="refs/heads/${branch}"
          mapfile -t registered_worktrees < <(
            git -C "$repo_root" worktree list --porcelain | awk -v ref="$branch_ref" '
              /^worktree / { path = substr($0, 10) }
              $0 == "branch " ref { print path }
            '
          )

          if [ "${#registered_worktrees[@]}" -ne 1 ]; then
            echo "Expected exactly one registered worktree for $branch; found ${#registered_worktrees[@]}." >&2
            exit 1
          fi

          worktree="${registered_worktrees[0]}"
          current_branch="$(git -C "$worktree" symbolic-ref --quiet --short HEAD || true)"
          if [ "$current_branch" != "$branch" ]; then
            echo "Issue worktree uses unexpected branch: ${current_branch:-DETACHED}" >&2
            exit 1
          fi

          echo "path=$worktree" >> "$GITHUB_OUTPUT"
          echo "repo_root=$repo_root" >> "$GITHUB_OUTPUT"

      - name: Launch PR audit through shared Codex App Server
        shell: bash
        env:
          ISSUE_NUMBER: ${{ steps.target.outputs.issue_number }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          SKILLFORGE_REPO_ROOT_RESOLVED: ${{ steps.worktree.outputs.repo_root }}
          SKILLFORGE_ISSUE_WORKTREE: ${{ steps.worktree.outputs.path }}
        run: |
          set -euo pipefail
          command -v python3 >/dev/null
          command -v setsid >/dev/null

          codex_home="${CODEX_HOME:-${HOME}/.codex}"
          socket_path="${SKILLFORGE_CODEX_APP_SERVER_SOCKET:-${codex_home}/app-server-control/app-server-control.sock}"
          if [ ! -S "$socket_path" ]; then
            echo "Codex App Server control socket is unavailable: $socket_path" >&2
            exit 1
          fi

          repo_key="${GITHUB_REPOSITORY//\//-}"
          state_dir="${HOME}/.skillforge/run/${repo_key}/issue-${ISSUE_NUMBER}"
          log_dir="${SKILLFORGE_LOG_ROOT:-${HOME}/.skillforge/logs}/${repo_key}"
          source_client="${state_dir}/app-server-client.py"
          audit_client="${state_dir}/pr-audit-client.py"
          executor_pid_file="${state_dir}/app-server-client.pid"
          audit_pid_file="${state_dir}/pr-audit-client.pid"
          ready_file="${state_dir}/app-server-ready"
          error_file="${state_dir}/app-server-error"
          completed_file="${state_dir}/app-server-completed"
          turn_file="${state_dir}/app-server-turn-id"
          thread_file="${state_dir}/app-server-thread-id"
          log_file="${log_dir}/issue-${ISSUE_NUMBER}-pr-audit-${GITHUB_RUN_ID}-app-server.log"
          mkdir -p "$state_dir" "$log_dir"

          process_from_pid_file_is_alive() {
            local file="$1"
            local marker="$2"
            [ -f "$file" ] || return 1
            local pid
            pid="$(cat "$file" 2>/dev/null || true)"
            [ -n "$pid" ] || return 1
            kill -0 "$pid" 2>/dev/null || return 1
            if [ -r "/proc/${pid}/cmdline" ]; then
              tr '\0' ' ' < "/proc/${pid}/cmdline" | grep -Fq "$marker" || return 1
            fi
            return 0
          }

          if process_from_pid_file_is_alive "$audit_pid_file" "$audit_client"; then
            echo "PR audit client for issue #${ISSUE_NUMBER} is already active; refusing a duplicate launch."
            exit 0
          fi

          if process_from_pid_file_is_alive "$executor_pid_file" "$source_client"; then
            echo "Execution turn for issue #${ISSUE_NUMBER} is still finishing; serializing the audit behind it."
            finished=false
            for _ in $(seq 1 1800); do
              if ! process_from_pid_file_is_alive "$executor_pid_file" "$source_client"; then
                finished=true
                break
              fi
              sleep 2
            done
            if [ "$finished" != true ]; then
              echo "Timed out waiting for the execution turn to finish before PR audit." >&2
              exit 1
            fi
          fi

          if [ ! -f "$source_client" ]; then
            echo "The issue App Server client is missing: $source_client" >&2
            echo "A review-ready issue must have been launched through codex-execute-ready.yml first." >&2
            exit 1
          fi
          if [ ! -f "$thread_file" ]; then
            echo "The persistent Codex thread id is missing for issue #${ISSUE_NUMBER}." >&2
            exit 1
          fi

          python3 - "$source_client" "$audit_client" <<'PY'
          from pathlib import Path
          import re
          import sys

          source_path = Path(sys.argv[1])
          target_path = Path(sys.argv[2])
          source = source_path.read_text(encoding="utf-8")
          pattern = re.compile(
              r'(?m)^(\s*)prompt = f"Execute GitHub issue #\{ISSUE_NUMBER\} according to AGENTS\.md\."\s*$'
          )
          replacement = r'\1prompt = os.environ["SKILLFORGE_TASK_PROMPT"]'
          patched, count = pattern.subn(replacement, source)
          if count != 1:
              raise SystemExit(f"Expected one executable prompt in {source_path}; found {count}")
          target_path.write_text(patched, encoding="utf-8")
          PY
          chmod 700 "$audit_client"

          task_prompt="Audit PR #${PR_NUMBER} for controlling issue #${ISSUE_NUMBER} using skills/codex-pr-audit/SKILL.md. Follow AGENTS.md and the audit skill exactly. Use a fresh independent technical reviewer as required. Do not implement fixes, merge, or enable auto-merge."

          rm -f "$audit_pid_file" "$ready_file" "$error_file" "$completed_file" "$turn_file"

          RUNNER_TRACKING_ID="" nohup setsid -w \
            env \
              SKILLFORGE_APP_SERVER_SOCKET="$socket_path" \
              SKILLFORGE_STATE_DIR="$state_dir" \
              SKILLFORGE_REPO_ROOT_RESOLVED="$SKILLFORGE_REPO_ROOT_RESOLVED" \
              SKILLFORGE_ISSUE_WORKTREE="$SKILLFORGE_ISSUE_WORKTREE" \
              SKILLFORGE_TASK_PROMPT="$task_prompt" \
              ISSUE_NUMBER="$ISSUE_NUMBER" \
              ISSUE_TITLE="PR #${PR_NUMBER} audit" \
              GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
              GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            python3 "$audit_client" >>"$log_file" 2>&1 &
          client_pid=$!
          printf '%s\n' "$client_pid" > "$audit_pid_file"
          printf '%s\n' "$log_file" > "${state_dir}/latest-pr-audit-log"

          launched=false
          for _ in $(seq 1 20); do
            if [ -f "$ready_file" ]; then
              launched=true
              break
            fi
            if [ -f "$error_file" ]; then
              echo "Codex PR audit launch failed: $(cat "$error_file")" >&2
              tail -n 100 "$log_file" >&2 || true
              rm -f "$audit_pid_file"
              exit 1
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              echo "Codex PR audit client exited before starting the turn." >&2
              tail -n 100 "$log_file" >&2 || true
              rm -f "$audit_pid_file"
              exit 1
            fi
            sleep 0.5
          done

          if [ "$launched" != true ]; then
            echo "Timed out waiting for Codex App Server to start the PR audit turn." >&2
            tail -n 100 "$log_file" >&2 || true
            exit 1
          fi

          echo "Codex PR audit launched for issue #${ISSUE_NUMBER}, PR #${PR_NUMBER}."
          echo "Thread: $(cat "$thread_file")"
          echo "Turn: $(cat "$turn_file")"
          echo "Local event log: ${log_file}"
